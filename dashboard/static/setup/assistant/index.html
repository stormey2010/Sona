<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Loading Sona setup…</title><style>body{margin:0;background:#080a11;color:#f7f8fc;font:14px system-ui;min-height:100vh;display:grid;place-items:center}div{display:grid;justify-items:center;gap:14px}i{width:32px;height:32px;border:3px solid #9f82f633;border-top-color:#9f82f6;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div><i></i><span>Loading assistant setup…</span></div><script>fetch("/setup/index.html").then(r=>{if(!r.ok)throw new Error("Setup shell was not found");return r.text()}).then(html=>{document.open();document.write(html);document.close()}).catch(error=>{document.body.innerHTML="<div><b>Could not load setup</b><span>"+error.message+"</span></div>"})</script></body></html>
