services:
  stt:
    build:
      context: .
      args:
        APP_UID: "${STT_UID:?Run ./setup.sh first to create .env}"
        APP_GID: "${STT_GID:?Run ./setup.sh first to create .env}"
    image: sona-stt:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /home/app
      HF_HOME: /home/app/.cache/huggingface
      STT_MODEL_DIR: /home/app/.cache/huggingface
      WAKEWORD_MODEL_DIR: /home/app/.cache/openwakeword
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "${AUDIO_GID:?Run ./setup.sh first to create .env}"
    volumes:
      - whisper-models:/home/app/.cache/huggingface
      - wakeword-models:/home/app/.cache/openwakeword
      - ${SONA_HOST_DIR:-.}/recordings:/app/recordings
      - ${SONA_HOST_DIR:-.}/wakewords:/app/wakewords:ro
      - ${SONA_HOST_DIR:-.}/assets:/app/assets:ro

  ha-mcp:
    image: ghcr.io/homeassistant-ai/ha-mcp:latest
    profiles: ["ha-mcp"]
    restart: unless-stopped
    environment:
      HOMEASSISTANT_URL: "${HOMEASSISTANT_URL:-}"
      HOMEASSISTANT_TOKEN: "${HOMEASSISTANT_TOKEN:-}"
      ENABLE_TOOL_SEARCH: "true"
      LOG_LEVEL: "INFO"

volumes:
  whisper-models:
  wakeword-models:
